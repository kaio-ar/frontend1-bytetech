        <main>
            <section>
                <h2>Cadastro de Cliente</h2>
                <p>Preencha os campos abaixo para criar seu cadastero na ByteTech.</p>
                <form id="form-cadastro" action="#" method="post"> <!--inicio do form para cadastro-->
                    <label for="nome">Nome completo:</label> <!--associa o label ao campo de nome-->
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name" required minlength="3">
                    <!--cria um campo obrigatório de texto com autocomplete e min de 3 caracteres-->

                    <label for="email">E-mail:</label> <!--associa label email ao campo de e-mail-->
                    <input type="email" id="email" name="email"
                        placeholder="exemplo@email.com"
                        autocomplete="email" required>
                    <!-- idem acima, porem verifica o formato básico de email com type="email"-->

                    <label for="cpf">CPF:</label> <!--idem acima, associa label cpf ao campo de CPF-->
                    <input type="text" id="cpf" name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                        title="Digite um CPF com 11 números, com ou sem pontuação."
                        autocomplete="off" required>
                    <!--formato de cpf definido em pattern: 9 dígitos em 3 grupos de 3 de 0 a 9 + 2 dígitos de 0 a 9. OBS: não confirma se CPF é válido-->

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required minlength="8">
                    <!--primeiro campo da senha, 8 caracteres mínimo-->

                    <label for="confirmacao-senha">Confirme sua senha:</label>

                    <input type="password" id="confirmacao-senha"
                        name="confirmacao-senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required minlength="8">
                    <!--segundo campo da senha-->

                    <button class="botao" type="submit">Criar cadastro</button>
                    <!-- botao que tenta enviar o form-->

                </form>

                <p>Já possui uma conta? <a href="login.html">Faça login</a>.</p>

            </section>

        </main>
